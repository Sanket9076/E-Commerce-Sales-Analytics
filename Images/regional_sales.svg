<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Outfit', 'Inter', system-ui, sans-serif; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);">
    <!-- Gradient definitions -->
    <defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
