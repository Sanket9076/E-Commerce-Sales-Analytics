            <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
        </linearGradient>
        <linearGradient id="coralGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#be123c" stop-opacity="0.2"/>
