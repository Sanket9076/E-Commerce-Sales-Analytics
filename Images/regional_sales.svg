    <text x="30" y="60" fill="#94a3b8" font-size="12">Regional contribution to total sales volume</text>
    
    <!-- Content goes here -->
    
    <!-- Grid -->
    <line x1="120.0" y1="80" x2="120.0" y2="405" stroke="#334155" stroke-dasharray="3" stroke-width="0.75"/><text x="120.0" y="420" fill="#94a3b8" font-size="10" text-anchor="middle">$0k</text><line x1="272.5" y1="80" x2="272.5" y2="405" stroke="#334155" stroke-dasharray="3" stroke-width="0.75"/><text x="272.5" y="420" fill="#94a3b8" font-size="10" text-anchor="middle">$3,400k</text><line x1="425.0" y1="80" x2="425.0" y2="405" stroke="#334155" stroke-dasharray="3" stroke-width="0.75"/><text x="425.0" y="420" fill="#94a3b8" font-size="10" text-anchor="middle">$6,800k</text><line x1="577.5" y1="80" x2="577.5" y2="405" stroke="#334155" stroke-dasharray="3" stroke-width="0.75"/><text x="577.5" y="420" fill="#94a3b8" font-size="10" text-anchor="middle">$10,200k</text><line x1="730.0" y1="80" x2="730.0" y2="405" stroke="#334155" stroke-dasharray="3" stroke-width="0.75"/><text x="730.0" y="420" fill="#94a3b8" font-size="10" text-anchor="middle">$13,600k</text>
    <line x1="120" y1="80" x2="120" y2="400" stroke="#64748b" stroke-width="1.5"/>
    
